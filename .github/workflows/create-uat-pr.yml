name: Create UAT PR

on:
  push:
    branches:
      - develop  # Trigger the workflow on pushes to 'develop' branch

jobs:
  create-pr-uat:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up GitHub CLI
      - name: Set up GitHub CLI
        run: |
          curl -sSL https://github.com/cli/cli/releases/download/v2.22.0/gh_2.22.0_linux_amd64.deb -o gh.deb
          sudo dpkg -i gh.deb
          sudo apt-get install -f

      # Step 3: Authenticate GitHub CLI using GitHub token
      - name: Authenticate GitHub CLI
        run: gh auth login --with-token < $GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Create a pull request from 'develop' to 'uat' (for changes to UAT)
      - name: Create PR for UAT
        run: |
          gh pr create --base uat --head develop --title "Deploy Changes to UAT" --body "PR for feature merge from develop to uat"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
