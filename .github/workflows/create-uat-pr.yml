name: Create UAT PR

on:
  push:
    branches:
      - develop  # Trigger the workflow on pushes to 'develop' branch

jobs:
  create-pr-uat:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Git
      - name: Set up Git
        run: |
          git fetch --prune --unshallow

      # Step 3: Get merged feature branches from develop
      - name: Get merged feature branches
        id: get_merged_branches
        run: |
          # Get merged feature branches from develop
          merged_branches=$(git log --merges --pretty=format:"%s" | grep -oP 'from \K\S+' | grep -v "develop" | grep -v "uat")
          echo "Merged branches: $merged_branches"
          
          # Clean up the branch names to remove 'adi789p/' prefix if present
          clean_branches=$(echo "$merged_branches" | sed 's/^adi789p\///')
          echo "Cleaned branches: $clean_branches"

          # Save the cleaned branches to an environment variable for use in later steps
          echo "cleaned_branches=$clean_branches" >> $GITHUB_ENV

      # Step 4: Debug Cleaned Branches
      - name: Debug Cleaned Branches
        run: |
          echo "Cleaned branches from the previous step: ${{ env.cleaned_branches }}"

      # Step 5: Create PRs for UAT
      - name: Create PRs for UAT
        run: |
          for feature_branch in ${{ env.cleaned_branches }}
          do
            # Create PR from feature branch to uat with '-uat' suffix
            pr_title="${feature_branch}-uat"
            pr_body="PR for feature merge from $feature_branch to uat"
            gh pr create --base uat --head $feature_branch --title "$pr_title" --body "$pr_body" --verbose
          done
        env:
          GH_TOKEN: ${{ secrets.GT_TOKEN }}
