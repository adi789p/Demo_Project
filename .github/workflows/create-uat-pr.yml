name: Create UAT PR

on:
  push:
    branches:
      - develop  # Trigger the workflow on pushes to 'develop' branch

jobs:
  create-pr-uat:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Fetch develop branch and merged feature branches
      - name: Fetch develop branch and get merged feature branches
        id: get_merged_branches
        run: |
          # Fetch the develop branch to ensure we have the commit history
          git fetch origin develop

          # Get the merged feature branches from 'develop' using git log
          merged_branches=$(git log origin/develop --merges --pretty=format:"%s" | grep -oP 'from \K\S+' | grep -vE "develop|uat")
          
          if [ -z "$merged_branches" ]; then
            echo "No merged branches found."
            exit 0
          fi
          
          # Clean up the branch names to remove 'adi789p/' prefix if present
          clean_branches=$(echo "$merged_branches" | sed 's/^adi789p\///')
          echo "Cleaned branches: $clean_branches"
          
          # Save the cleaned branches into an environment variable for use in subsequent steps
          echo "cleaned_branches=$clean_branches" >> $GITHUB_ENV

      # Step 3: Create PRs for UAT from the cleaned feature branches
      - name: Create PRs for UAT
        run: |
          if [ -z "$cleaned_branches" ]; then
            echo "No branches to create PRs for."
            exit 0
          fi
          
          # Create a PR for each feature branch
          for feature_branch in $cleaned_branches
          do
            pr_title="${feature_branch}-uat"
            pr_body="PR for feature merge from $feature_branch to uat"
            gh pr create --base uat --head $feature_branch --title "$pr_title" --body "$pr_body"
          done
        env:
          GH_TOKEN: ${{ secrets.GT_TOKEN }}
